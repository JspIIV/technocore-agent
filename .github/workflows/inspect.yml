name: inspect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "leaderboard")
          import build
          flow = build.export(build.ROOMS["flow"])
          shown = 0
          for n in sorted(flow):
              f = flow[n]
              if f.get("mints") and shown < 3:
                  print("sweep", n, "keys", sorted(f), "mints sample:", json.dumps(f["mints"][:4])[:800]); shown += 1
          v = next((flow[n] for n in sorted(flow) if flow[n].get("void")), None)
          print("void sample:", json.dumps((v or {}).get("void", [])[:3])[:600])
          m = next((flow[n] for n in sorted(flow) if flow[n].get("missed")), None)
          print("missed sample:", json.dumps((m or {}).get("missed", [])[:3])[:600])
          pnl = build.export(build.ROOMS["pnl"])
          print("pnl extra keys:", sorted({k for r in pnl.values() for k in r}))
          PY
